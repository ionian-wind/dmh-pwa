      (() => {
        try {
          const saved = JSON.parse(
            localStorage.getItem('dmh-config:uiTheme') || '"light"',
          );
          const dark =
            saved === 'dark' ||
            (saved === 'auto' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) {
            document.documentElement.style.colorScheme = 'dark';
            document.documentElement.style.backgroundColor = '#14141d';
          }
        } catch {
          // Ignore malformed storage; the app applies the default theme.
        }
      })();
